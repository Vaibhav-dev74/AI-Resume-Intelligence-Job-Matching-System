version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_intelligence_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: resume_intelligence_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/resume_intelligence
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/resume_intelligence
      - USE_PGVECTOR=true
      - MODEL_PROVIDER=local
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    container_name: resume_intelligence_ui
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/resume_intelligence
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgrespassword@postgres:5432/resume_intelligence
      - USE_PGVECTOR=true
      - MODEL_PROVIDER=local
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    depends_on:
      - api

volumes:
  postgres_data:
