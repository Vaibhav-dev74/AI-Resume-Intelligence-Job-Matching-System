[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-resume-intelligence"
version = "1.0.0"
description = "Production-grade AI Resume Intelligence & Job Matching Platform"
authors = [{ name = "AI Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
